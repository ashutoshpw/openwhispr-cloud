# Copilot Setup Steps
# This file configures the environment for GitHub Copilot Workspace
# Reference: https://gh.io/copilot-coding-agent-tips

steps:
  - name: Install Bun
    run: |
      curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.0"
      export BUN_INSTALL="$HOME/.bun"
      export PATH="$BUN_INSTALL/bin:$PATH"
      echo "$BUN_INSTALL/bin" >> $GITHUB_PATH
      bun --version

  - name: Cache node_modules
    uses: actions/cache@v4
    with:
      path: |
        ~/.bun/install/cache
        node_modules
      key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      restore-keys: |
        ${{ runner.os }}-bun-

  - name: Install dependencies
    run: bun install

  - name: Start PostgreSQL
    run: docker compose up -d postgres

  - name: Wait for PostgreSQL
    run: |
      timeout 30 bash -c 'until docker compose exec -T postgres pg_isready -U postgres; do sleep 1; done'

  - name: Setup database schema
    run: bun run db:push
