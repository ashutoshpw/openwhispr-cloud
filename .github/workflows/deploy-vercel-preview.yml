name: Deploy to Vercel - Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-vercel-preview.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy'
        required: false
        type: string

concurrency:
  group: preview-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write
  issues: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      (!startsWith(github.event.pull_request.title, 'WIP') &&
       !startsWith(github.event.pull_request.title, 'wip') &&
       !startsWith(github.event.pull_request.title, '[WIP]') &&
       !startsWith(github.event.pull_request.title, '[wip]'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: www
            working_directory: apps/www
            project_id: prj_p1DeT78RzflBid8YvCHjI5eIJlJc
            project_name: openwhispr-www
            alias_prefix: openwhispr-www
          - app: api
            working_directory: apps/api
            project_id: prj_Fkke6EqdAmQ5FkMVqdCVN9jiOUvC
            project_name: openwhispr-api
            alias_prefix: openwhispr-api
          - app: auth
            working_directory: apps/auth
            project_id: prj_HhI4HOv3ZR9DGKR65dzKHGvV2vrZ
            project_name: openwhispr-auth
            alias_prefix: openwhispr-auth
          - app: notes
            working_directory: apps/notes
            project_id: prj_O6paA2AkfjUpmkFjsx6CdQMWTmLy
            project_name: openwhispr-notes
            alias_prefix: openwhispr-notes
          - app: admin
            working_directory: apps/admin
            project_id: prj_JsmYl8TcnfVUlSMC2uDZGkWczOGd
            project_name: openwhispr-admin
            alias_prefix: openwhispr-admin
          - app: mcp
            working_directory: apps/mcp
            project_id: prj_BURLxASe6bsyxBFEjnn7IXaUsAl5
            project_name: openwhispr-mcp
            alias_prefix: openwhispr-mcp
    environment:
      name: preview

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Vercel
        uses: W3Dev/vercel-deploy@main
        with:
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org_id: 'team_XlKdoQLCLOaHFIGh0cZ5SJuv'
          vercel_project_id: ${{ matrix.project_id }}
          vercel_project_name: ${{ matrix.project_name }}
          package_manager: 'bun'
          node_version: '22'
          working_directory: ${{ matrix.working_directory }}
          deploy_args: '--archive=tgz'
          alias_prefix: ${{ matrix.alias_prefix }}
          environment: 'preview'
