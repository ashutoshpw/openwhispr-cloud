name: Dashboard - Deploy to Vercel - Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/dashboard/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy (leave empty if using branch)'
        required: false
        type: string
      branch_name:
        description: 'Branch name to deploy (leave empty if using PR number)'
        required: false
        type: string

permissions:
  contents: read
  deployments: write
  pull-requests: write
  issues: write
jobs:
  deploy-preview:
    runs-on: self-hosted
    
    env:
      VERCEL_ORG_ID: team_M1i3qUTW4i3A6mETy54E1Fy8
      VERCEL_PROJECT_ID: prj_YLF5HawHAOzh4oKqS8wmxoBZ9hU5
    
    steps:
      - name: Determine ref to checkout
        id: determine-ref
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ inputs.pr_number }}" ]; then
              echo "ref=refs/pull/${{ inputs.pr_number }}/head" >> $GITHUB_OUTPUT
              echo "pr_number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
              echo "preview_alias=pr-${{ inputs.pr_number }}--nexvio-ai" >> $GITHUB_OUTPUT
            elif [ -n "${{ inputs.branch_name }}" ]; then
              echo "ref=${{ inputs.branch_name }}" >> $GITHUB_OUTPUT
              echo "pr_number=" >> $GITHUB_OUTPUT
              echo "preview_alias=" >> $GITHUB_OUTPUT
            else
              echo "Error: Either pr_number or branch_name must be provided"
              exit 1
            fi
          else
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "preview_alias=pr-${{ github.event.pull_request.number }}--nexvio-ai" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.determine-ref.outputs.ref }}
          fetch-depth: 0

      - name: Download Database URL from Neon Workflow
        id: download_db_url
        if: steps.determine-ref.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ steps.determine-ref.outputs.pr_number }};
            const artifactName = `neon-db-url-pr-${prNumber}`;
            
            try {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'neon_workflow.yml',
                per_page: 10
              });
              
              for (const run of runs.workflow_runs) {
                if (run.status === 'completed' && run.conclusion === 'success') {
                  try {
                    const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id
                    });
                    
                    const artifact = artifacts.artifacts.find(a => a.name === artifactName);
                    if (artifact) {
                      const fs = require('fs');
                      const { execSync } = require('child_process');
                      
                      fs.mkdirSync('.github/artifacts', { recursive: true });
                      const response = await fetch(`https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/actions/artifacts/${artifact.id}/zip`, {
                        headers: {
                          'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                          'Accept': 'application/vnd.github+json'
                        }
                      });
                      
                      const buffer = Buffer.from(await response.arrayBuffer());
                      fs.writeFileSync('.github/artifacts/artifact.zip', buffer);
                      execSync('unzip -q .github/artifacts/artifact.zip -d .github/artifacts/');
                      
                      const dbUrl = fs.readFileSync('.github/artifacts/database_url.txt', 'utf8').trim();
                      core.setOutput('db_url', dbUrl);
                      return;
                    }
                  } catch (err) {
                    console.log(`Artifact not found in run ${run.id}: ${err.message}`);
                  }
                }
              }
              
              core.setOutput('db_url', '');
              console.log(`Artifact ${artifactName} not found in any successful workflow run`);
            } catch (error) {
              core.setOutput('db_url', '');
              console.log(`Error downloading artifact: ${error.message}`);
            }

      - name: Extract Database URL
        id: extract_db_url
        if: steps.download_db_url.outputs.db_url != ''
        run: |
          if [ -f .github/artifacts/database_url.txt ]; then
            DB_URL=$(cat .github/artifacts/database_url.txt)
            echo "db_url=$DB_URL" >> $GITHUB_OUTPUT
            echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun install -g vercel

      - name: Configure Git Author
        run: |
          git config --global user.email "ashutosh@w3dev.in"
          git config --global user.name "Ashutosh"
          git commit --amend --no-edit --author="Ashutosh <ashutosh@w3dev.in>"

      - name: Setup Vercel Project Linking
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"prj_FVUmj4OL2EnYNdXF6yh6RBuJayRw","projectName":"nexvio-ai"}' > .vercel/project.json

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Update DATABASE_URL in .env.preview.local
        if: steps.extract_db_url.outputs.db_url != ''
        run: |
          ENV_FILE=".env.preview.local"
          DB_URL="${{ steps.extract_db_url.outputs.db_url }}"
          
          if [ -f "$ENV_FILE" ]; then
            if grep -q "^DATABASE_URL=" "$ENV_FILE"; then
              sed -i "s|^DATABASE_URL=.*|DATABASE_URL=$DB_URL|" "$ENV_FILE"
            else
              echo "DATABASE_URL=$DB_URL" >> "$ENV_FILE"
            fi
            echo "Updated DATABASE_URL in $ENV_FILE"
          else
            echo "Warning: $ENV_FILE not found after vercel pull"
          fi

      - name: Build with Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          if [ -n "${{ steps.determine-ref.outputs.preview_alias }}" ]; then
            vercel alias set $DEPLOYMENT_URL ${{ steps.determine-ref.outputs.preview_alias }} --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}
          fi
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> $GITHUB_ENV
          echo "Preview URL: $DEPLOYMENT_URL"

      - name: Deployment Summary
        run: |
          echo "✅ Preview deployment completed successfully!"
          echo "Environment: preview"
          echo "Trigger: ${{ github.event_name }}"
          if [ -n "${{ steps.determine-ref.outputs.pr_number }}" ]; then
            echo "PR Number: #${{ steps.determine-ref.outputs.pr_number }}"
            echo "Preview Alias: ${{ steps.determine-ref.outputs.preview_alias }}"
          elif [ -n "${{ inputs.branch_name }}" ]; then
            echo "Branch: ${{ inputs.branch_name }}"
          fi
          echo "Deployment URL: ${{ env.DEPLOYMENT_URL }}"
          if [ -n "${{ steps.extract_db_url.outputs.db_url }}" ]; then
            echo "Database URL: ${{ steps.extract_db_url.outputs.db_url }}"
          fi

      - name: Comment PR with Preview URL
        if: steps.determine-ref.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.determine-ref.outputs.pr_number }};
            const previewAlias = "${{ steps.determine-ref.outputs.preview_alias }}";
            const deploymentUrl = "${{ env.DEPLOYMENT_URL }}";
            const marker = '<!-- dashboard-preview-deployment-comment -->';
            const commentBody = `${marker}\n\n🚀 Preview deployment ready!\n\n**Preview URL:** ${deploymentUrl}\n**Alias:** https://${previewAlias}.vercel.app`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });
            
            const existingComment = comments.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes(marker)
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            }


