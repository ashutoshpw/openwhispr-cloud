name: Deploy to Vercel - Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy'
        required: false
        type: string
      branch_name:
        description: 'Branch name to deploy'
        required: false
        type: string

permissions:
  contents: read
  deployments: write
  pull-requests: write
  issues: write
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    
    steps:
      - name: Determine ref to checkout
        id: determine-ref
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ inputs.pr_number }}" ]; then
              echo "ref=refs/pull/${{ inputs.pr_number }}/head" >> $GITHUB_OUTPUT
              echo "pr_number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
              echo "preview_alias=pr-${{ inputs.pr_number }}--nextjs-starter-kit" >> $GITHUB_OUTPUT
            elif [ -n "${{ inputs.branch_name }}" ]; then
              echo "ref=${{ inputs.branch_name }}" >> $GITHUB_OUTPUT
              echo "pr_number=" >> $GITHUB_OUTPUT
              echo "preview_alias=" >> $GITHUB_OUTPUT
            else
              echo "Error: Either pr_number or branch_name must be provided"
              exit 1
            fi
          else
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "preview_alias=pr-${{ github.event.pull_request.number }}--nextjs-starter-kit" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.determine-ref.outputs.ref }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun install -g vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          if [ -n "${{ steps.determine-ref.outputs.preview_alias }}" ]; then
            vercel alias set $DEPLOYMENT_URL ${{ steps.determine-ref.outputs.preview_alias }} --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}
          fi
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> $GITHUB_ENV
          echo "Preview URL: $DEPLOYMENT_URL"

      - name: Deployment Summary
        run: |
          echo "✅ Preview deployment completed successfully!"
          echo "Environment: preview"
          echo "Trigger: ${{ github.event_name }}"
          if [ -n "${{ steps.determine-ref.outputs.pr_number }}" ]; then
            echo "PR Number: #${{ steps.determine-ref.outputs.pr_number }}"
            echo "Preview Alias: ${{ steps.determine-ref.outputs.preview_alias }}"
          elif [ -n "${{ inputs.branch_name }}" ]; then
            echo "Branch: ${{ inputs.branch_name }}"
          fi
          echo "Deployment URL: ${{ env.DEPLOYMENT_URL }}"

      - name: Comment PR with Preview URL
        if: steps.determine-ref.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.determine-ref.outputs.pr_number }};
            const previewAlias = "${{ steps.determine-ref.outputs.preview_alias }}";
            const deploymentUrl = "${{ env.DEPLOYMENT_URL }}";
            const marker = '<!-- starter-kit-preview-deployment -->';
            const commentBody = `${marker}\n\n🚀 Preview deployment ready!\n\n**Preview URL:** ${deploymentUrl}\n**Alias:** https://${previewAlias}.vercel.app`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });
            
            const existingComment = comments.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes(marker)
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            }


