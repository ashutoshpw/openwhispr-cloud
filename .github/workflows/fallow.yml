name: Fallow analysis
on: [push, pull_request]

jobs:
  fallow:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: fallow-rs/fallow@v2
        with:
          format: sarif

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: fallow-results.sarif
