version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nextjs-starter-postgres
    restart: always
    environment:
      POSTGRES_DB: nextjs_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-starter-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nextjs_starter
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/nextjs_starter
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run db:push && npm run dev"

volumes:
  postgres_data:
